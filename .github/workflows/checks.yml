name: Quality checks
on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit committed international catalog, not an outdated rebuild
        run: python scripts/validate_catalog.py
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Test name ranking and filters
        run: npm test
      - name: Build production app
        run: npm run build
