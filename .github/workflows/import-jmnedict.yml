name: Expand Japanese origin names using EDRDG dictionary
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_jmnedict.py
      - .github/workflows/import-jmnedict.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astera-jmnedict-import
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XML and Japanese romanization readers
        run: python -m pip install --disable-pip-version-check lxml==6.0.2 pykakasi==2.3.0
      - name: Import source-verified Japanese first names and canonical variants
        run: python -u scripts/enrich_jmnedict.py
      - name: Refresh source-backed cultural origin counts
        run: python scripts/build_origin_coverage.py
      - name: Rebuild mobile search index
        run: python scripts/build_client_index.py
      - name: Validate full dataset
        run: python scripts/validate_catalog.py
      - name: Check Japanese country-origin list and documented sources
        run: |
          python - <<'PY'
          import json
          r=json.load(open('public/names/origin-coverage.json'))
          print('Japanese with cultural-origin evidence',r['countries'].get('JP'))
          assert r['countries'].get('JP',0)>1000
          d=json.load(open('public/names/manifest.json'))
          assert d['jmnedict']['new']>1000
          PY
      - name: Publish catalog with Japanese name attestations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/names/extended.json public/names/search-index.json public/names/manifest.json public/names/coverage.json public/names/origin-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish source-attested Japanese names and multi-kanji variants"
            for n in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
