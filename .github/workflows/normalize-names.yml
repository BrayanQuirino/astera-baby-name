name: Publish reviewed name corrections
on:
  push:
    branches: [main]
    paths:
      - src/data/name_corrections.json
      - scripts/apply_name_corrections.py
      - .github/workflows/normalize-names.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize catalog and recalculate provenance statistics
        run: python scripts/apply_name_corrections.py
      - name: Verify catalog integrity
        run: python scripts/validate_catalog.py
      - name: Commit reviewed entries and coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/names/extended.json public/names/manifest.json public/names/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: normalize María and other reviewed compound names"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
