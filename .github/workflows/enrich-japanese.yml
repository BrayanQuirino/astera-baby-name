name: Restore and verify Japanese baby name coverage
on:
  push:
    branches: [main]
    paths:
      - src/data/japanese_curated.json
      - scripts/enrich_japanese_names.py
      - .github/workflows/enrich-japanese.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: japanese-names
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge Japanese names and attested kanji
        run: python scripts/enrich_japanese_names.py
      - name: Regenerate public mobile index
        run: python scripts/build_client_index.py
      - name: Validate full JSON and mobile index
        run: python scripts/validate_catalog.py
      - name: Confirm Japanese boy and girl coverage
        run: |
          python - <<'PY'
          import json
          names=json.load(open('public/names/extended.json'))
          gender={g:sum(g==n.get('gender') and ('japon' in n.get('origin','').lower() or 'japanese' in n.get('origin','').lower()) for n in names) for g in ('boy','girl','unisex')}
          print('Japanese origin names',gender)
          assert gender['boy']>=40 and gender['girl']>=40
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/names/extended.json public/names/search-index.json public/names/manifest.json public/names/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: restore Japanese names and documented kanji in public catalog"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
