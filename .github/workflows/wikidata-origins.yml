name: Enrich documented country origins from Wikidata
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_wikidata_origins.py
      - .github/workflows/wikidata-origins.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astera-wikidata-origins
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import independently documented language origins
        run: python -u scripts/enrich_wikidata_origins.py
      - name: Update provenance coverage and compact search index
        run: |
          python scripts/build_origin_coverage.py
          python scripts/build_client_index.py
          python scripts/validate_catalog.py
      - name: Publish verified origins only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/names/extended.json public/names/origin-coverage.json public/names/search-index.json
          if ! git diff --cached --quiet; then
            git commit -m "data: enrich attested Wikidata country origins"
            for n in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
