name: Inspect INE Spain first-name workbook
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-ine.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl --quiet
      - name: Inspect official Spanish naming workbook without changing data
        run: |
          python - <<'PY'
          import io,urllib.request
          import openpyxl
          url='https://www.ine.es/daco/daco42/nombyapel/nombres_por_edad_media.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Astera Name Project'})
          with urllib.request.urlopen(req,timeout=40) as response:blob=response.read()
          print('Bytes',len(blob),flush=True)
          book=openpyxl.load_workbook(io.BytesIO(blob),read_only=True,data_only=True)
          for sheet in book:
              print('SHEET',sheet.title,sheet.max_row,sheet.max_column,flush=True)
              for row in list(sheet.values)[:13]:
                  print(repr(row[:10]),flush=True)
          PY
