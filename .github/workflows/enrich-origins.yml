name: Publish source-backed cultural origins
on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_origin_countries.py
      - src/data/cultural_origin_rules.json
      - .github/workflows/enrich-origins.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astera-origin-country-import
  cancel-in-progress: true
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive cultural countries from annotated name origins and Wikidata languages
        run: python -u scripts/enrich_origin_countries.py
      - name: Rebuild compact public search index
        run: python scripts/build_client_index.py
      - name: Validate catalog and origin-country integrity
        run: python scripts/validate_catalog.py
      - name: Assert countries have real source-classified names
        run: |
          python - <<'PY'
          import json
          report=json.load(open('public/names/origin-coverage.json'))
          print(report['countries'])
          assert report['classified']>3000
          assert report['countries']['JP']>=100
          assert report['countries']['ES']>=100
          assert report['countries']['FR']>=100
          assert report['countries']['GB']>=100
          assert report['unclassified']>1000
          PY
      - name: Commit full and compact catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/names/extended.json public/names/search-index.json public/names/origin-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish attested multi-country cultural origins"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
